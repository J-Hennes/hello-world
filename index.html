<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Phones Table</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f2f5;
      color: #333;
      padding: 40px 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 2rem;
      color: #2d2d2d;
    }

    #status {
      text-align: center;
      font-size: 1rem;
      color: #888;
      margin-bottom: 20px;
    }

    .table-wrapper {
      overflow-x: auto;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      background: white;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }

    thead {
      background: #4f46e5;
      color: white;
    }

    thead th {
      padding: 14px 18px;
      text-align: left;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-size: 0.8rem;
    }

    tbody tr {
      border-bottom: 1px solid #e5e7eb;
      transition: background 0.15s;
    }

    tbody tr:last-child {
      border-bottom: none;
    }

    tbody tr:hover {
      background: #f5f3ff;
    }

    tbody td {
      padding: 12px 18px;
      vertical-align: middle;
    }

    .error {
      text-align: center;
      color: #dc2626;
      font-size: 1rem;
      margin-top: 20px;
    }

    .record-count {
      text-align: right;
      font-size: 0.85rem;
      color: #6b7280;
      margin-top: 12px;
      padding-right: 4px;
    }

    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 24px;
    }

    .pagination button {
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .pagination button:hover:not(:disabled) {
      background: #3730a3;
    }

    .pagination button:disabled {
      background: #c7c7c7;
      cursor: not-allowed;
    }

    .pagination #page-info {
      font-size: 0.95rem;
      color: #374151;
    }
  </style>
</head>
<body>

  <h1>📱 Phones Table</h1>
  <div id="status">Loading data...</div>
  <div class="table-wrapper">
    <table id="phones-table">
      <thead id="table-head"></thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>
  <div class="record-count" id="record-count"></div>
  <div class="pagination">
    <button id="prev-btn" onclick="changePage(-1)" disabled>&#8592;</button>
    <span id="page-info"></span>
    <button id="next-btn" onclick="changePage(1)">&#8594;</button>
  </div>
  <div class="error" id="error-msg"></div>

  <script>
    const SUPABASE_URL = 'https://hdzjbkxovhjgxwgvhjni.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhkempia3hvdmhqZ3h3Z3Zoam5pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM4MzYyNzQsImV4cCI6MjA4OTQxMjI3NH0.ONIftH3n0NU2Ilw5fqkBjzcSpPkglfFs0czXoBOboEQ';
    const TABLE_NAME = 'Phones_tbl';

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const ROWS_PER_PAGE = 25;
    let allData = [];
    let allColumns = [];
    let currentPage = 1;

    const hiddenColumns = new Set([4]);
    const columnLabels = { 3: 'Covered By', 0: 'ID', 5: 'Status' };

    function renderPage(page) {
      const bodyEl  = document.getElementById('table-body');
      const countEl = document.getElementById('record-count');
      const pageInfo = document.getElementById('page-info');
      const prevBtn  = document.getElementById('prev-btn');
      const nextBtn  = document.getElementById('next-btn');

      const totalPages = Math.ceil(allData.length / ROWS_PER_PAGE);
      const start = (page - 1) * ROWS_PER_PAGE;
      const end   = Math.min(start + ROWS_PER_PAGE, allData.length);
      const pageData = allData.slice(start, end);

      bodyEl.innerHTML = '';
      pageData.forEach(row => {
        const tr = document.createElement('tr');
        allColumns.forEach((col, index) => {
          if (hiddenColumns.has(index)) return;
          const td = document.createElement('td');
          td.textContent = row[col] !== null && row[col] !== undefined ? row[col] : '—';
          if (index === 0) td.style.color = 'red';
          tr.appendChild(td);
        });
        bodyEl.appendChild(tr);
      });

      countEl.textContent = `Showing ${start + 1}–${end} of ${allData.length} records`;
      pageInfo.textContent = `Page ${page} of ${totalPages}`;
      prevBtn.disabled = page === 1;
      nextBtn.disabled = page === totalPages;
    }

    function changePage(direction) {
      const totalPages = Math.ceil(allData.length / ROWS_PER_PAGE);
      currentPage = Math.min(Math.max(currentPage + direction, 1), totalPages);
      renderPage(currentPage);
    }

    async function loadTable() {
      const statusEl = document.getElementById('status');
      const headEl   = document.getElementById('table-head');
      const errorEl  = document.getElementById('error-msg');

      const { data, error } = await client.from(TABLE_NAME).select('*');

      if (error) {
        statusEl.textContent = '';
        errorEl.textContent = `Error: ${error.message}`;
        return;
      }

      if (!data || data.length === 0) {
        statusEl.textContent = 'No records found in the table.';
        return;
      }

      allData    = data;
      allColumns = Object.keys(data[0]);

      // Build header row
      const headerRow = document.createElement('tr');
      allColumns.forEach((col, index) => {
        if (hiddenColumns.has(index)) return;
        const th = document.createElement('th');
        th.textContent = columnLabels[index] !== undefined ? columnLabels[index] : col;
        headerRow.appendChild(th);
      });
      headEl.appendChild(headerRow);

      statusEl.textContent = '';
      renderPage(currentPage);
    }

    loadTable();
  </script>

</body>
</html>
